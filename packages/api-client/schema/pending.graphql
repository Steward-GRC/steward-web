#
# Schema that is ahead of the pinned gateway copy: read after gateway.graphql by codegen, so the
# web builds against it before steward-gateway ships it. Proposed in steward-gateway#79 (inline
# review comments); a part goes once the pinned copy carries it. The mock serves the same shape.

# Inline review comments on a policy version, proposed in
# https://github.com/Steward-GRC/steward-gateway/issues/79 (steward-core#33 stores them). An
# approver comments on text in the version under review; the drafter sees the threads on the
# highlighted text, replies and resolves. A rejected version keeps its open threads as the
# feedback. Anchors are the quoted text plus which match of it (counting from 1), so a client can
# place the highlight again in the stored document.
extend type Query {
  # The threads on a version the caller may read: an approver gets only their own, the authors
  # and site admins all of them. An obfuscated reader gets no message bodies.
  reviewThreads(policyVersionId: ID!): [ReviewThread!]!
}

extend type Query {
  # What changed in each section of the version since the caller, an approver on its run, last
  # reviewed it: when they last commented, replied, voted, sent comments or marked it reviewed.
  versionChangesSinceReview(policyVersionId: ID!): [SectionDiff!]!
}

extend type Mutation {
  # The caller, an approver on the version's run, has reviewed the version as it is now.
  markVersionReviewed(policyVersionId: ID!): Boolean!
  # Starts a thread with its first message. Approvers on the version's run, its authors and site
  # admins only.
  # suggestedText proposes replacement text for the quote; it opens a suggestion on the other
  # side's turn. Text equal to the quote is a plain comment.
  # toUserId is for the author: the one approver the thread is with. An approver's own thread is
  # with that approver and the author.
  addReviewThread(policyVersionId: ID!, quote: String!, occurrence: Int!, body: String!, suggestedText: String, toUserId: ID): ReviewThread!
  # The side whose turn it is answers with different text; the turn passes to the other side.
  counterReviewSuggestion(threadId: ID!, text: String!): ReviewThread!
  # Ends the suggestion with an outcome and resolves the thread. The text of an accepted change is
  # applied to the document by the client, which saves it.
  closeReviewSuggestion(threadId: ID!, outcome: SuggestionOutcome!, reason: String): ReviewThread!
  # Appends a message to a thread.
  replyReviewThread(threadId: ID!, body: String!): ReviewThread!
  # Resolves a thread, or reopens it with resolved: false.
  setReviewThreadResolved(threadId: ID!, resolved: Boolean!): ReviewThread!
  # Deletes a thread; only the person who started it.
  deleteReviewThread(threadId: ID!): Boolean!
}

type ReviewThread {
  id: ID!
  policyVersionId: ID!
  # The text the thread was made on.
  quote: String!
  # Which match of the quote in the version's text, counting from 1.
  occurrence: Int!
  resolved: Boolean!
  createdAt: DateTime!
  # The approver the thread is with. Only that approver and the policy's authors see it.
  approverUserId: ID!
  messages: [ReviewMessage!]!
  # Present when someone proposed replacement text for the quote.
  suggestion: ReviewSuggestion
}

# Who is acting on a suggestion: the policy's authors, or a reviewer on its run.
enum SuggestionSide {
  AUTHOR
  REVIEWER
}

enum SuggestionOutcome {
  # The author took the text. Closes on the author's turn.
  CHANGED
  # The reviewer accepted the author's counter. Closes on the reviewer's turn.
  AGREED
  # The author dropped the note without changing the text. Closes on the author's turn.
  REMOVED
  # The side that proposed first took it back, while it was not their turn.
  WITHDRAWN
  # The side whose turn it was ended it, with a reason.
  NOT_AGREED
}

type ReviewSuggestion {
  # The text now proposed.
  text: String!
  # Whose turn it is to answer.
  turn: SuggestionSide!
  rounds: [SuggestionRound!]!
  # Set once it has ended.
  outcome: SuggestionOutcome
  reason: String
  closedBy: ID
  closedText: String
}

type SuggestionRound {
  by: SuggestionSide!
  text: String!
  userId: ID!
  createdAt: DateTime!
}

type ReviewMessage {
  id: ID!
  authorUserId: ID!
  authorName: String
  body: String!
  createdAt: DateTime!
}

# What a category holds, proposed in https://github.com/Steward-GRC/steward-gateway/issues/80
# (steward-core#34 stores it). BOTH is the default. NONE makes the category a container that only
# holds child categories. Creating a draft in a category, and moving a document into one, is
# refused (CATEGORY_REFUSES_TYPE) when the category does not accept the type. Narrowing is
# refused (CATEGORY_HOLDS_DOCUMENTS, with the count in the message) while documents the
# category would no longer accept are in it, published or draft.
enum CategoryDocumentTypes {
  BOTH
  POLICIES
  PROCEDURES
  NONE
}

extend type Category {
  documentTypes: CategoryDocumentTypes!
  # Authors creating under this category (or one that inherits its template) must use the default
  # template: freeform and any other template are refused. Proposed in steward-gateway#88.
  defaultTemplateLocked: Boolean!
}

extend type Query {
  # How many documents a category holds now, for the settings form's check before it narrows.
  categoryDocumentCounts(categoryId: ID!): CategoryDocumentCounts!
}

type CategoryDocumentCounts {
  policies: Int!
  procedures: Int!
}

extend type Mutation {
  # Site admin only. Widening always works; narrowing is refused while the category holds
  # documents it would no longer accept.
  setCategoryDocumentTypes(id: ID!, documentTypes: CategoryDocumentTypes!): Category!
}

# Moving several documents at once, proposed in
# https://github.com/Steward-GRC/steward-gateway/issues/82 (steward-core#35). All or nothing; site
# admins only. The preview changes nothing.
extend type Query {
  previewMovePolicies(policyIds: [ID!]!, homeCategoryId: ID!): MovePoliciesPreview!
}

extend type Mutation {
  movePolicies(policyIds: [ID!]!, homeCategoryId: ID!): MovePoliciesResult!
}

type MovePoliciesPreview {
  items: [MovePolicyItem!]!
}

type MovePoliciesResult {
  moved: [MovePolicyItem!]!
}

type MovePolicyItem {
  policyId: ID!
  title: String!
  number: String!
  # The number in the target's sequence; null when it cannot move.
  newNumber: String
  # Why it cannot move; null when it can.
  refusal: String
}

# The appendix life cycle. An appendix belongs to a policy or procedure, not to one of its
# versions, and has a life of its own: create -> draft, publish -> the version readers see, edit ->
# a new draft beside it, retire (kept and restorable), and only a site admin deletes one for good.
# Every version of a policy shows the latest published appendices. Appendices are not policy: they
# take no part in an approval and nobody comments on them. Publishing is for authors; the diff of
# a draft against the published row is for authors, site admins and compliance only.
enum AppendixState {
  DRAFT
  PUBLISHED
}

# One row of an appendix's own version table (not a policy version).
type AppendixVersion {
  id: ID!
  versionNo: Int!
  state: AppendixState!
  title: String!
  contentJson: String!
  createdAt: String!
  createdBy: ID!
  updatedAt: String!
  updatedBy: ID!
  publishedAt: String
  publishedBy: ID
}

type PolicyAppendix {
  id: ID!
  policyId: ID!
  # The place among the live appendices (A, B, C); null while retired.
  letter: String
  orderIndex: Int!
  createdAt: String!
  createdBy: ID!
  retiredAt: String
  retiredBy: ID
  # The latest published row. Readers see only this.
  published: AppendixVersion
  # The author's work in progress; editors only.
  draft: AppendixVersion
  versions: [AppendixVersion!]!
}

extend type Query {
  # Readers get the live appendices that have a published row; editors also the drafts, and the
  # retired ones with includeRetired.
  policyAppendices(policyId: ID!, includeRetired: Boolean): [PolicyAppendix!]!
  policyAppendix(id: ID!): PolicyAppendix!
  # The draft against what is published. Authors, site admins and compliance only.
  appendixDiff(id: ID!): [SectionDiff!]!
}

extend type Mutation {
  createPolicyAppendix(policyId: ID!, title: String!, contentJson: String!): PolicyAppendix!
  saveAppendixDraft(id: ID!, title: String!, contentJson: String!): PolicyAppendix!
  publishAppendix(id: ID!): PolicyAppendix!
  retireAppendix(id: ID!): PolicyAppendix!
  restoreAppendix(id: ID!): PolicyAppendix!
  # Site admin only: removes the appendix and its history.
  deleteAppendixForever(id: ID!): Boolean!
  reorderPolicyAppendices(policyId: ID!, orderedIds: [ID!]!): [PolicyAppendix!]!
}

extend type Mutation {
  # Site admin only. The category must name a default template to lock.
  setCategoryTemplateLock(id: ID!, locked: Boolean!): Category!
}

# Live co-editing inside an appendix: its own room and token, away from the policy's draft. Whoever
# may edit the policy may join; a checkpoint becomes the appendix's draft.
type AppendixCollabToken {
  token: String!
  wsUrl: String!
  expiresAt: String!
}

extend type Mutation {
  issueAppendixCollabToken(appendixId: ID!): AppendixCollabToken!
}
