}

"A reusable contact block attached to this policy (U16)."
type PolicyContact {
  department: String
  email: String
  hours: String
  id: ID!
  label: String!
  name: String
  notes: String
  phone: String
  role: String
}

"This caller's acknowledgement of one policy version."
type AckStatus {
  acknowledged: Boolean!
  ackedAt: DateTime
  "True when this caller is in the ack audience at all; false means no banner is shown."
  required: Boolean!
}

type BreakGlassGrant {
  grantedUntil: DateTime!
}

"One append-only event in a policy's combined publish-and-approval history (U18): submitted, a stage decision, published, changes requested, or withdrawn."
type HistoryEntry {
  actorName: String
  comment: String
  at: DateTime!
  kind: String!
  stage: String
  versionLabel: String!
}

"The diff between the current version and the one it superseded (U12/U19)."
type PolicyVersionSummary {
  diff: [PolicySectionDiff!]!
  version: String!
}

type PolicySectionDiff {
  changeType: String!
  sectionKey: String!
  sectionTitle: String!
  wordDiffHtml: String
}

# The admin organisation directory: SAML/OIDC single sign-on connections, one per email
# domain. An Organization must clear two independent gates before it can be activated:
# `verified` (domain ownership, by DNS TXT record) and `testPassed` (an end-to-end IdP
# login test). Nothing here sets testPassed — that gate is flipped by the sign-in-side SSO
# flow once it exists; until then every connection stays activatable-in-principle but
# ungated in practice, which this port surfaces honestly rather than faking a pass. The SP
# (service-provider) signing certificate is platform-wide, not per-connection. The
# original's REST convenience endpoints (importing IdP metadata from a URL or file,
# fetching a signing certificate by URL, minting a time-boxed remote test link) are not
# carried over: they sit outside the GraphQL contract every other operation here uses, and
# manual entry of the IdP fields already covers the same ground.
extend type Query {
  "Every configured organisation SSO connection. Site-admin only."
  organizations: [Organization!]!
  "An organisation's IdP-group-claim-to-platform-group mappings. Site-admin only."
  groupMappings(connectionId: ID!): [GroupMapping!]!
  "The platform's active SP (service-provider) signing certificate. Site-admin only."
  spCertificate: SpCertificate!
}

extend type Mutation {
  """
  Registers a new organisation SSO connection: unverified, untested and disabled until the
  domain is verified and the IdP connection passes its test. Site-admin only.
  """
  addOrganization(input: AddOrganizationInput!): Organization!
  """
  Mints a DNS TXT domain-verification challenge. The token is stable by default; rotate:
  true mints a fresh one, which also revokes the domain's prior verified proof. Site-admin
  only.
  """
  startDomainVerification(domain: String!, rotate: Boolean): DomainVerification!
  "Checks the domain's DNS TXT record against its verification token. Site-admin only."
  verifyDomain(domain: String!): Organization!
  "Enables an organisation's SSO connection for sign-in. Site-admin only."
  activateOrganization(domain: String!): Organization!
  "Disables an organisation's SSO connection. Does not clear its gates. Site-admin only."
  disableOrganization(domain: String!): Organization!
  """
  Updates an organisation's per-connection login toggles. Each argument is optional; omit
  one to leave it unchanged. Site-admin only.
  """
  updateIdPConnection(domain: String!, jitEnabled: Boolean, allowLocal: Boolean): Organization!
  """
  Changes an organisation's IdP protocol (SAML <-> OIDC). DESTRUCTIVE: it resets the
  connection to the start, clearing both gates and disabling it, so the domain must be
  re-verified and re-tested before re-activation. Site-admin only.
  """
  changeOrgProtocol(
    domain: String!
    protocol: String!
    config: [KeyValueInput!]
    secretRef: String
  ): Organization!
  "Removes an organisation's SSO connection. Irreversible. Site-admin only."
  deleteOrganization(domain: String!): Boolean!
  "Adds an IdP-group-claim-to-platform-group mapping for a connection. Site-admin only."
  addGroupMapping(connectionId: ID!, idpGroupClaimValue: String!, targetGroupId: ID!): GroupMapping!
  "Removes a group mapping by id. Site-admin only."
  deleteGroupMapping(mappingId: ID!): Boolean!
  """
  Mints a new SP signing certificate and activates it immediately, superseding the previous
  one. Site-admin only.
  """
  forceRotateSpCertificate: SpCertificate!
}

"One organisation's SSO connection, keyed by email domain."
type Organization {
  "Identity-service connection id; keys SP-cert-independent, per-connection calls."
  connectionId: ID!
  "The connection alias; /auth/sso/start?connection=<alias> matches it against identity Discover."
  connectionAlias: String!
  displayName: String!
  domain: String!
  "Currently live for sign-in. Both gates must have passed to activate."
  enabled: Boolean!
  "When true, an unknown SSO email is auto-provisioned on first sign-in."
  jitEnabled: Boolean!
  orgName: String!
  "'saml' | 'oidc'"
  protocol: String!
  "End-to-end IdP login test gate."
  testPassed: Boolean!
  "Domain-ownership gate (DNS TXT verification)."
  verified: Boolean!
  "When true, this organisation's users may also sign in with a local password."
  allowLocal: Boolean!
}

"One SP (service-provider) signing certificate. At most one is active at a time."
type SpCertificate {
  active: Boolean!
  certPem: String!
  notAfter: String!
  serial: String!
  spMetadataXml: String!
}

"""
Maps one asserted IdP group-claim value to a platform group by id. The target is a group
id, not a name, so JIT provisioning never grants the wrong same-named group.
"""
type GroupMapping {
  connectionId: ID!
  id: ID!
  idpGroupClaimValue: String!
  targetGroupId: ID!
}

"DNS TXT domain-verification challenge. Publish dnsRecordValue at dnsRecordName, then verify."
type DomainVerification {
  dnsRecordName: String!
  dnsRecordValue: String!
  instructions: String!
  token: String!
}

"One IdP connection config entry (e.g. SAML entityId/ssoUrl/signingCertificate, or OIDC issuer/clientId)."
input KeyValueInput {
  key: String!
  value: String!
}

"A new organisation SSO connection. secretRef names the stored client secret (OIDC)."
input AddOrganizationInput {
  config: [KeyValueInput!]
  displayName: String
  domain: String!
  orgName: String!
  protocol: String!
  secretRef: String
}

# --- Authoring: the policy/procedure editor ---
# Extends the existing library `Policy` (the reader/library's read-only row) with the
# backend-id fields and per-viewer authorization projection only the editor needs - the
# SAME row, not a parallel type. The display-only fields above (category/subcategory/
# version/status) stay the library's own aggregated view.
#
# Document content is plain text here, same as the reader's bodyText, not the original's
# rich Lexical JSON: no shared document renderer exists yet, so a draft is authored as
# plain per-section text (PolicyVersion.contentJson, a JSON-encoded array of
# `{ sectionKey, title, text }`) until one does.
extend type Policy {
  ownerUserId: ID!
  homeGroupId: ID!
  templateId: ID
  templateNone: Boolean!
  currentDraftVersionId: ID
  currentPublishedVersionId: ID
  retiredAt: String
  viewerCan: PolicyViewerCan!
}

"Per-viewer authorization projection of a Policy, computed server-side. The UI mirrors these for UX only; the gateway is the real enforcement boundary."
type PolicyViewerCan {
  read: Boolean!
  edit: Boolean!
  submit: Boolean!
  approve: Boolean!
  contentObfuscated: Boolean!
  canBreakGlass: Boolean!
  ack: Boolean!
}

extend type Query {
  "One policy by backend id, for the editor. Null when it doesn't exist or the caller can't see it."
  policy(id: ID!): Policy
  "The CALLING user's own policies with a working draft, most-recently-updated first. Any signed-in author."
  myDraftPolicies: [Policy!]!
  "The groups any signed-in author may create a policy under (unlike groupChildren, not site-admin-gated)."
  authorableGroups: [Group!]!
  "The templates selectable when creating a policy (unlike templates, not site-admin-gated)."
  authorableTemplates(ownerGroupId: ID): [Template!]!
  "A template's current (newest) version, with its section outline. Null for a template with no version yet."
  latestTemplateVersion(templateId: ID!): TemplateVersion
  "The working draft version of a policy's content, for the editor. Null when there is no draft."
  draftVersion(policyId: ID!): PolicyVersion
}

extend type Mutation {
  "Creates a new policy/procedure with an empty working draft. The owner is the calling user."
  createPolicy(
    homeGroupId: ID!
    title: String!
    sensitivity: Sensitivity!
    templateId: ID
    documentType: DocumentType
  ): Policy!
  "Saves the author's edits to the policy's working draft. templateVersionId pins the template version the content was scaffolded from; null for a freeform draft."
  saveDraft(policyId: ID!, contentJson: String!, templateVersionId: ID): PolicyVersion!
  "Cuts the working draft as a new published version. Refused unless the caller holds edit access and every required section has content."
  publishDraft(policyId: ID!): PolicyVersion!
  "Discards a policy's working draft, leaving any already-published version untouched."
  discardDraft(policyId: ID!): Boolean!
  addAppendix(policyVersionId: ID!, title: String!, contentJson: String!): Appendix!
  updateAppendix(id: ID!, title: String!, contentJson: String!): Appendix!
  deleteAppendix(id: ID!): Boolean!
  reorderAppendices(policyVersionId: ID!, orderedIds: [ID!]!): [Appendix!]!
}

type TemplateVersion {
  id: ID!
  templateId: ID!
  versionNo: Int!
  sections: [Section!]!
}

"One section of a template's outline; a draft scaffolded from a template keeps these keys."
type Section {
  key: String!
  title: String!
  order: Int!
  level: Int!
  required: Boolean!
}

type PolicyVersion {
  id: ID!
  policyId: ID!
  versionNo: Int!
  status: String!
  templateVersionId: ID
  "Opaque to the gateway: a JSON-encoded array of `{ sectionKey, title, text }` authored sections."
  contentJson: String!
  appendices: [Appendix!]!
}

type Appendix {
  id: ID!
  policyVersionId: ID!
  title: String!
  contentJson: String!
  orderIndex: Int!
  letter: String!
}

# --- AI: authoring assist, drafting and review ---
# Trimmed from the original's AI surface to what the editor calls: the inline per-section
# assist, whole-draft generation, and review & gap-analysis. searchAndAnswer and the
# site-admin provider settings aren't ported here; they belong to a future "Ask" area and
# the admin settings area respectively.
type AuthoringAssistResult {
  suggestion: String!
  operationId: String!
}

enum AssistOperation {
  ASSIST_OPERATION_UNSPECIFIED
  ASSIST_OPERATION_DRAFT
  ASSIST_OPERATION_EXPAND
  ASSIST_OPERATION_REWRITE
  ASSIST_OPERATION_CLARIFY
  ASSIST_OPERATION_SUMMARIZE
}

input AuthoringAssistInput {
  policyId: ID!
  sectionKey: String!
  editableContent: String!
  operation: AssistOperation!
  instruction: String
}

enum AIJobPhase {
  AI_JOB_PHASE_PENDING
  AI_JOB_PHASE_RUNNING
  AI_JOB_PHASE_SUCCEEDED
  AI_JOB_PHASE_FAILED
}

"Poll aiJob(jobId) until phase reaches a terminal value; once SUCCEEDED, fetch the content by resultRef via aiJobResultContent."
type AIJobStatus {
  jobId: ID!
  phase: AIJobPhase!
  resultRef: String
  error: String
}

type AIJobResultContent {
  operation: String!
  resultJson: String!
}

input SubmitDraftGenerationSectionInput {
  key: String!
  title: String!
  order: Int!
}

input SubmitDraftGenerationInput {
  homeGroupId: ID
  title: String
  brief: String!
  sections: [SubmitDraftGenerationSectionInput!]!
}

input SubmitPolicyReviewSectionInput {
  key: String!
  title: String!
  content: String!
}

input SubmitPolicyReviewInput {
  policyId: ID!
  sections: [SubmitPolicyReviewSectionInput!]!
}

"Returned by both async AI job submissions below; simplified from the original's two identically-shaped result types into one."
type AIJobHandle {
  jobId: ID!
}

"Best-effort: never errors on a downstream failure, so AI affordances can disable themselves without taking an unrelated flow down with them."
type AIHealth {
  available: Boolean!
  reason: String
}

extend type Query {
  "One inline authoring suggestion for a section currently being edited. Never auto-applied."
  authoringAssist(input: AuthoringAssistInput!): AuthoringAssistResult!
  aiJob(jobId: ID!): AIJobStatus!
  "Fetch a completed async AI job's content by resultRef (AIJobStatus.resultRef once phase is SUCCEEDED)."
  aiJobResultContent(resultRef: String!): AIJobResultContent!
  "Whether AI is usable right now for the calling user."
  aiHealth: AIHealth!
}

extend type Mutation {
  "Submit whole-draft generation as an async job; poll aiJob(jobId) for the result."
  submitDraftGeneration(input: SubmitDraftGenerationInput!): AIJobHandle!
  "Submit review & gap-analysis of an existing draft as an async job; the result is a findings list, never an edit applied to the policy."
  submitPolicyReview(input: SubmitPolicyReviewInput!): AIJobHandle!
}

# --- Collaboration: real-time co-editing session tokens ---
# wsUrl is same-origin (this app's own server proxies or, for now, hosts the relay itself;
# see server/src/collabServer.ts) so the browser never holds a cross-origin connection or an
# API token. The caller sends the token as the first message after connecting, never in the
# URL, so it never lands in an access log.
input IssueCollabTokenInput {
  policyId: ID!
  draftId: ID!
  "The draft's pinned template version; null for a freeform draft."
  templateVersionId: ID
}

type IssueCollabTokenPayload {
  token: String!
  wsUrl: String!
  "ISO-8601; the client reconnects (issuing a fresh token) once past this instant."
  expiresAt: String!
}

extend type Mutation {
  """
  Issues a short-lived websocket token for the co-editing session. The caller must already
  hold edit access to the draft; refused otherwise.
  """
  issueCollabToken(input: IssueCollabTokenInput!): IssueCollabTokenPayload!
}

# The admin audit log: a tamper-evident, hash-chained record of every consequential action.
# Trimmed to the two operations the admin audit area sends (the segment/checkpoint query
# behind the original's export flow is not carried — no export in this port). Record ids
# are String, not ID: the backing store's ids are 64-bit and a GraphQL ID round-trips
# through a JS Number in some clients, which truncates a ones past 2^53; String avoids that
# regardless of which client reads it.
extend type Query {
  "A page of audit records, newest first. tier/groupId/actorUserId/subject filter server-side; action and a date range are left to the caller. Site-admin only."
  auditLog(
    tier: String
    groupId: ID
    actorUserId: ID
    subject: String
    pageSize: Int
    pageToken: String
  ): AuditQueryPage!
  "Recomputes the hash chain across [fromRecordId, toRecordId] and reports whether it still holds. Site-admin only."
  verifyAuditChain(fromRecordId: String!, toRecordId: String!): AuditChainVerification!
}

"One tamper-evident audit record: the hash chain links recordHash to the prior record's own."
type AuditRecord {
  id: String!
  recordUuid: ID!
  tier: String!
  action: String!
  actorUserId: ID!
  subject: String!
  groupId: ID!
  "ISO-8601."
  occurredAt: String!
  prevHash: String!
  recordHash: String!
  legalBasisExempt: Boolean!
  """
  Human-readable labels resolved server-side at read time from the actor/group/subject ids
  above, so the UI never has to fan out its own lookups. Null on a resolution miss, in which
  case the caller falls back to the raw id.
  """
  actorName: String
  groupName: String
  subjectLabel: String
}

type AuditQueryPage {
  records: [AuditRecord!]!
  nextPageToken: String!
}

"""
The result of recomputing a hash-chain segment. valid is false the moment one record's
recordHash fails to match the hash of its own fields plus the prior record's recordHash.
"""
type AuditChainVerification {
  valid: Boolean!
  recordsChecked: Int!
  errors: [String!]!
}

# --- Workflow: the approvals inbox and an approver's decision ---
# Backed by the workflow service. Caller identity is bound server-side from the signed-in
# session: signalWorkflow's actor and pendingTasks'/upcomingApprovals' approver filter are
# never taken from input. Reassigning a stranded approval (swapAssignee) is not vendored yet;
# it stays a GitHub issue on the approvals area.

enum ApprovalStatus {
  APPROVAL_STATUS_UNSPECIFIED
  APPROVAL_STATUS_DRAFT
  APPROVAL_STATUS_IN_REVIEW
  APPROVAL_STATUS_APPROVED
  APPROVAL_STATUS_SCHEDULED
  APPROVAL_STATUS_PUBLISHED
  APPROVAL_STATUS_SUPERSEDED
  APPROVAL_STATUS_REJECTED
  APPROVAL_STATUS_WITHDRAWN
  APPROVAL_STATUS_ARCHIVED
}

enum SignalType {
  SIGNAL_TYPE_UNSPECIFIED
  SIGNAL_TYPE_APPROVE
  SIGNAL_TYPE_REJECT
  SIGNAL_TYPE_REQUEST_CHANGES
  SIGNAL_TYPE_WITHDRAW
  SIGNAL_TYPE_RETIRE
}

"One current assignee on a stage: who must approve, and their decision state/comment/time."
type StageAssignee {
  userId: String!
  "Resolved display name; null when the directory can't resolve it."
  name: String
  "pending / approved / rejected."
  state: String!
  "Decision comment, present once decided."
  comment: String
  "ISO-8601 decision timestamp, present once decided."
  decidedAt: String
}

"One approve-as-group unit's live tally on a stage. groupName is resolved by the gateway from groupId."
type StageUnitProgress {
  groupId: String!
  groupName: String
  quorum: String! # one | majority | all
  required: Int! # approvals needed to satisfy the internal quorum
  approvals: Int!
  pending: Int! # members still able to approve
  roster: Int! # total member roster size
  status: String! # SATISFIED | PENDING | REJECTED
}

type WorkflowStatus {
  status: ApprovalStatus!
  runId: String!
  currentStageIdx: Int!
  "Resolved workflow-definition stage names, in order."
  stageNames: [String!]!
  "Current assignees per stage, index-aligned with stageNames: the stepper's roster source."
  stageAssignees: [[StageAssignee!]!]!
  "Per-stage approve-as-group unit progress, index-aligned with stageNames; an empty inner list means the stage has no unit-mode groups."
  stageUnitProgress: [[StageUnitProgress!]!]!
}

type PendingTask {
  taskId: ID!
  runId: String!
  policyVersionId: ID!
  policyTitle: String!
  stageIndex: Int!
  dueAt: String # ISO-8601; null when the engine has not set a due time
}

type UpcomingApproval {
  policyVersionId: ID!
  policyTitle: String!
  stageIndex: Int!
  stageName: String!
}

extend type Query {
  """
  Status of the approval saga for a policy version. Returns
  APPROVAL_STATUS_UNSPECIFIED when the workflow service has no record (the policy was
  published without going through an approval flow).
  """
  workflowStatus(policyVersionId: ID!): WorkflowStatus!

  "Pending approval tasks awaiting the authenticated user. The approver id is bound server-side."
  pendingTasks: [PendingTask!]!

  """
  Approvals where the authenticated user is an approver on a future (not-yet-reached) stage —
  visibility/heads-up, not yet actionable. The approver id is bound server-side.
  """
  upcomingApprovals: [UpcomingApproval!]!
}

extend type Mutation {
  """
  Deliver an approver decision to an active run. The actor is bound server-side. The comment
  is required for APPROVE and REJECT signals (the workflow service rejects an empty one).

  policyVersionId is authoritative: the decision targets that version's CURRENT active
  approval. runId/taskId are advisory only (a cached inbox row may be stale); the server
  ignores them for resolution. A stale click on a no-longer-active approval returns a
  FailedPrecondition ("refresh your inbox"), never a raw NotFound.
  """
  signalWorkflow(
    policyVersionId: ID!
    runId: ID!
    taskId: ID!
    signal: SignalType!
    comment: String!
  ): Boolean!
}

# --- Reporting: the privacy officer's case work ---
#
# Unlike every slice above, reporting has no original to pin from: the compliance reporting
# module is new to Steward (steward-reporting), ported straight from its own live gateway
# schema (Steward-GRC/steward-gateway graphql/reporting.graphqls, commit eb8faea). Trimmed to
# the officer-facing operations the staff reporting area sends: the case queue, case detail,
# the two-way thread, notes, assignment, status, the risk assessment, the notification
# tracker and close-out. The reporter-facing operations (submitAnonymousReport, checkReport,
# replyToReport, the signed-in reporter's own named reports) and attachment downloads belong
# to the public reporting front end, out of scope for this port; they, and the re-pin to a
# live steward-gateway fetch, are follow-ups.

enum CaseStatus { NEW IN_REVIEW NEEDS_REPORTER_REPLY RISK_ASSESSMENT NOTIFICATION_DUE CLOSED }
enum ReportKind { ANONYMOUS NAMED }
enum InformationKind { HEALTH CONTACT FINANCIAL NOT_SURE }
enum ReportAnswer { YES NO NOT_SURE }
enum MessageAuthor { REPORTER OFFICER }
enum RiskRecipient { STAFF_ONLY UNKNOWN_PEOPLE ANOTHER_ORGANISATION }
enum RiskViewed { YES PROBABLY NO }
enum RiskMitigation { FULLY PARTLY NOT_AT_ALL }
enum RiskSuggestion { NOTIFICATION_LIKELY_REQUIRED LOW_PROBABILITY_OF_COMPROMISE }
enum BreachDecision { REPORTABLE NOT_REPORTABLE }
enum NoticeRecipient { AFFECTED_PEOPLE REGULATOR MEDIA OTHER }
enum NoticeStatus { NOT_SENT DRAFT SENT NOT_NEEDED }
enum CaseOutcome { SUBSTANTIATED NOT_SUBSTANTIATED INCONCLUSIVE }

"What the reporter told us. Nothing here asks who the reporter is."
type ReportDetails {
  whatHappened: String!
  occurred: String!
  location: String!
  informationKinds: [InformationKind!]!
  stillHappening: ReportAnswer
}

type ThreadMessage {
  id: ID!
  author: MessageAuthor!
  officerUserId: ID
  body: String!
  createdAt: String!
}

"Attachment metadata only (reporting strips the file's own metadata server-side). Downloading the content is a follow-up (reportAttachmentContent, not vendored here)."
type ReportAttachment {
  id: ID!
  filename: String!
  contentType: String!
  sizeBytes: Int!
  metadataStripped: Boolean!
}

type CaseNote {
  id: ID!
  authorUserId: ID!
  body: String!
  createdAt: String!
}

type RiskFactors {
  information: [InformationKind!]!
  recipient: RiskRecipient
  viewed: RiskViewed
  mitigation: RiskMitigation
}

input RiskFactorsInput {
  information: [InformationKind!]!
  recipient: RiskRecipient!
  viewed: RiskViewed!
  mitigation: RiskMitigation!
}

type RiskAssessment {
  factors: RiskFactors!
  suggestion: RiskSuggestion
  decision: BreachDecision
  reason: String!
  decidedByUserId: ID!
  decidedAt: String!
}

type CaseNotice {
  id: ID!
  recipient: NoticeRecipient!
  label: String!
  method: String!
  daysAllowed: Int!
  dueOn: String!
  status: NoticeStatus!
  sentOn: String
}

type CorrectiveAction {
  description: String!
  policyId: ID
}

input CorrectiveActionInput {
  description: String!
  policyId: ID
}

type CaseSummary {
  id: ID!
  caseCode: String!
  kind: ReportKind!
  status: CaseStatus!
  summary: String!
  assigneeUserId: ID
  receivedAt: String!
  nextDeadline: String
}

type CaseStatusCount {
  status: CaseStatus!
  count: Int!
}

type CaseQueue {
  cases: [CaseSummary!]!
  counts: [CaseStatusCount!]!
}

type ReportCase {
  id: ID!
  caseCode: String!
  kind: ReportKind!
  status: CaseStatus!
  details: ReportDetails!
  reporterUserId: ID
  assigneeUserId: ID
  receivedAt: String!
  discoveredOn: String
  attachments: [ReportAttachment!]!
  thread: [ThreadMessage!]!
  notes: [CaseNote!]!
  assessment: RiskAssessment
  notices: [CaseNotice!]!
  outcome: CaseOutcome
  correctiveActions: [CorrectiveAction!]!
  closedAt: String
}

extend type Query {
  "Officers only: the case queue, optionally filtered by status and/or assignee."
  reportCases(statuses: [CaseStatus!], assigneeUserId: ID): CaseQueue!
  "Officers only: one case's full detail."
  reportCase(caseId: ID!): ReportCase!
}

extend type Mutation {
  "Officers only: posts a message the reporter can see in the two-way thread."
  postCaseMessage(caseId: ID!, body: String!): ThreadMessage!
  "Officers only: an internal note, never shown to the reporter."
  addCaseNote(caseId: ID!, body: String!): CaseNote!
  "Officers only. A null assigneeUserId clears the assignee."
  assignCase(caseId: ID!, assigneeUserId: ID): ReportCase!
  "Officers only. Any status but CLOSED; closing goes through closeCase."
  setCaseStatus(caseId: ID!, status: CaseStatus!): ReportCase!
  "Officers only: sets the discovery date every notification deadline counts from."
  setCaseDiscoveryDate(caseId: ID!, discoveredOn: String!): ReportCase!
  "Officers only: records the guided risk assessment and its reportable/not-reportable decision."
  recordRiskAssessment(caseId: ID!, factors: RiskFactorsInput!, decision: BreachDecision!, reason: String!): RiskAssessment!
  "Officers only: adds a notification-tracker entry; its deadline is set from the discovery date server-side."
  addCaseNotice(caseId: ID!, recipient: NoticeRecipient!, label: String, method: String): CaseNotice!
  "Officers only. sentOn (YYYY-MM-DD) is required with SENT."
  updateCaseNotice(caseId: ID!, noticeId: ID!, status: NoticeStatus!, sentOn: String): CaseNotice!
  "Officers only: the outcome, corrective actions and the optional closing message to the reporter."
  closeCase(caseId: ID!, outcome: CaseOutcome!, correctiveActions: [CorrectiveActionInput!], closingMessage: String): ReportCase!
}
