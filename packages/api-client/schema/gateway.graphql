"""
Vendored slice of the gateway schema. Steward's own gateway is not ported yet, so this
file is hand-pinned from the original gateway's v3.0.0 SDL (see ../schema-refs.env),
trimmed to the operations steward-web actually sends: the signed-in user and the
diagnostics report. It gains more of the upstream schema as later ports add
operations, and schema-generate.sh switches from this vendored copy to a live fetch
once steward-gateway publishes its own schema on its main branch.

Identity-provider-specific wording in the original schema's descriptions is dropped (Steward
signs in through Ory Kratos); nothing else about the shape of these two operations has changed.
"""

scalar DateTime

type Query {
  "Build and version facts for a bug report. Any signed-in user; refused when signed out."
  diagnostics: Diagnostics!
  "The signed-in user, from the verified session. Null when signed out."
  me: Me
}

"The facts about the signed-in user that drive identity and permission checks."
type Me {
  email: String!
  id: ID!
  name: String!
  permissions: [String!]!
  roles: [String!]!
  username: String!
}

type Diagnostics {
  actor: DiagnosticsActor!
  "The appliance version, read from an optional mount. Null when not on the appliance."
  appliance: String
  gateway: ComponentVersion!
  generatedAt: DateTime!
  "The pinned release version. Null when unknown."
  release: String
  services: [ComponentVersion!]!
  thirdParty: [ComponentVersion!]!
  "This read's own trace id."
  traceId: String!
}

type DiagnosticsActor {
  "Set during act-as: the user the real admin is acting as."
  actingAs: DiagnosticsActingAs
  id: ID!
  roles: [String!]!
  username: String!
}

type DiagnosticsActingAs {
  id: ID!
  roles: [String!]!
  username: String!
}

type ComponentVersion {
  commit: String
  name: String!
  status: ComponentStatus!
  "\"unavailable\" or \"unknown\" when it can't be read."
  version: String!
}

enum ComponentStatus {
  OK
  UNAVAILABLE
}
