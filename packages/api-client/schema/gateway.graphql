# ---- graphql/identity.graphqls
# --- Identity / RBAC ---
# Backed by identity (IdentityReadService / IdentityAdminService). The caller
# for `me` is the signed-in user, never taken from input. Mutations are
# admin-gated at the gateway and again in identity.

type User {
  userId: ID!
  name: String!
  firstName: String!             # structured given name; empty when the IdP provided none and the user has not set it on /welcome
  lastName: String!              # structured family name; empty when the IdP provided none and the user has not set it on /welcome
  email: String!
  enabled: Boolean!
  roles: [String!]!              # global elevated roles; reader is implicit and never listed
  scopes: RoleScopes!            # category-scoped author/approver grants
  groupIds: [ID!]!               # ids of the groups the user is a direct member of
  idpGroups: [String!]!          # IdP group names; category rules match them
  policyOverrides: [PolicyOverride!]!
  isRoot: Boolean!               # the protected root site-admin; cannot be disabled/demoted
  permissions: [String!]!        # effective permission catalog entries, computed server-side from roles + grants
  localAccount: Boolean!         # true = a local account created via createLocalUser; false = federated (SSO)
  username: String!              # login username; for SSO/JIT users derived from the email local-part
  needsOnboarding: Boolean!      # true until the user completes first-run onboarding (completeOnboarding); existing pre-feature users are already onboarded (false)
  managedGroupIds: [ID!]!        # platform group ids this user is a LOCAL group-manager of; empty when the user manages none
  memberships: [GroupMembership!]!  # per-group membership provenance, parallel to groupIds; lets the UI mark IdP-synced memberships read-only
  # Account-level BCP-47 language preference, e.g. "en" / "en-US".
  # Modelled like firstName/lastName — non-null with "" as the unset sentinel
  # (identity stores an empty string for "never chosen"), so the client falls
  # back to its own default rather than treating null specially.
  locale: String!
  # Soft-delete (tombstone) state. Both are null for a live account. Only the
  # admin directory lists tombstoned accounts, via users(includeDeleted: true);
  # the UI renders such a row as closed/merged and never offers it as a
  # selectable target. deletedAt is the RFC3339 tombstone time.
  # mergedIntoUserId is the surviving account a merged-away row now points at,
  # null when the account was deleted outright.
  deletedAt: String
  mergedIntoUserId: ID
}

# GroupMembership is one groupIds entry with its provenance.
# groupId matches an entry in User.groupIds; source is server-set:
# "manual" (admin / self-service / group-manager grant) or "idp-sync" (created
# by the IdP group-mapping path). The My Groups editor renders idp-sync rows
# read-only.
type GroupMembership {
  groupId: ID!
  source: String!                # "manual" | "idp-sync"
}

type RoleScopes {
  author: [String!]!             # category names
  approver: [String!]!           # category names
}

enum OverrideEffect { ALLOW DENY }

type PolicyOverride {
  policyNumber: String!
  effect: OverrideEffect!
}

type UserPage {
  users: [User!]!
  nextPageToken: String!
}

# Lightweight id→name pair returned by resolveUserLabels. Used by callers that
# hold a list of user ids (e.g. from audit/history records) and need display
# names without full User objects or site-admin directory access.
type UserLabel {
  id: ID!
  name: String!
  # Secondary identifier for user pickers, so accounts that share a display
  # name are distinguishable — most sharply on the account-merge page, which
  # deletes the source account irreversibly. NULLABLE and
  # additive: existing consumers that select only { id name } are unaffected,
  # and a user that identity holds with no address resolves to null rather
  # than an empty string. Sourced from the user row the underlying identity
  # read already returns (ListUsersByEmail / GetUser) — no extra round-trip.
  email: String
}

extend type Query {
  # me -> IdentityReadService.ResolveClaims/GetUser for the caller (identity the signed-in user).
  # users -> IdentityReadService.ListUsersByEmail: search -> email_substring, pageSize -> limit, pageToken/nextPageToken -> the opaque cursor.
  #   includeDeleted -> include_deleted: also return soft-deleted (tombstoned) accounts, marked by
  #   User.deletedAt / User.mergedIntoUserId. Default false. Gated like the whole query (user.manage,
  #   which only site-admin holds). searchUsers never sets it: a picker must not offer a deleted account.
  # resolveUserLabels -> resolve a list of user ids to display names; no directory enumeration, no user.manage permission required.
  # searchUsers -> lightweight typeahead: any authenticated caller, returns id+name pairs for users whose
  #   email contains `query` (backed by IdentityReadService.ListUsersByEmail). No full directory
  #   enumeration — the required `query` arg prevents open-ended sweeps. Results capped at `limit`
  #   (default 20, server-side max 200 per the underlying RPC).
  me: User!
  users(search: String, pageSize: Int, pageToken: String, includeDeleted: Boolean): UserPage!
  resolveUserLabels(ids: [ID!]!): [UserLabel!]!
  searchUsers(query: String!, limit: Int): [UserLabel!]!
  # policiesByOwner -> PolicyService.ListPoliciesByOwner: the policies a user
  # owns/authors (in this system the owner IS the RACI author). Surfaced to a
  # site-admin as the "orphaned set" before/after deleting a user so ownership
  # can be re-assigned; a user with a non-empty set cannot be deleted (deleteUser
  # blocks) until reassignUserPolicies clears it. Retired policies are excluded
  # unless includeRetired is true. Site-admin only.
  policiesByOwner(userId: ID!, includeRetired: Boolean): [Policy!]!
  # myDrafts is the self-service twin of policiesByOwner: the signed-in
  # caller's own policies that currently have a draft version, with no
  # site-admin gate (every caller may read their own drafts). Mirrors
  # revokeMySessions vs revokeUserSessions.
  myDrafts: [Policy!]!
  # previewAccountMerge -> IdentityAdminService.PreviewAccountMerge: a read-only,
  # side-effect-free projection of what merging sourceUserId INTO targetUserId
  # would move/dedupe (owned policies, RACI grants, acknowledgments, workflow
  # items, preferences), plus any warnings and whether the merge requires a
  # privileged confirmation. Surfaced to the admin BEFORE mergeAccounts so the
  # operation can be reviewed. Site-admin only.
  previewAccountMerge(sourceUserId: ID!, targetUserId: ID!): AccountMergePreview!
  # previewUserDeletion -> IdentityAdminService.PreviewUserDeletion: a read-only
  # dry run of deleteUser for the delete confirm dialog. Reports what the delete
  # would block on (pending approval seats, the root account), orphan (owned
  # policies), purge (RACI grants) or drop (access rows, the local credential),
  # plus warnings. Identity fails closed: if any class cannot be read the query
  # errors (USER_DELETE_CHECKS_UNAVAILABLE) rather than returning a partial
  # preview. Site-admin only, like deleteUser.
  previewUserDeletion(userId: ID!): UserDeletionPreview!
  # managedGroupMembers -> IdentityReadService.ListUsersInGroup: the DIRECT
  # members of a platform group, for the group-manager "My Groups" editor
  #. Authorized for site-admins AND for a LOCAL group-manager of
  # groupId (unlike the site-admin-only `users` query). Each User carries
  # memberships[] so the client can mark IdP-synced memberships read-only.
  managedGroupMembers(groupId: ID!): [User!]!
  # platformGroups -> IdentityReadService.ListGroups: the identity platform
  # groups directly under parentId (the root groups when it is null), every
  # page. These are the groups memberships, group managers, SSO group mappings
  # and reporting's REPORTING_OFFICER_GROUPS name by id, not core's categories
  # (the admin app's "Groups" pages). Site-admin only.
  platformGroups(parentId: ID): [PlatformGroup!]!
  # myManagedGroups -> IdentityReadService.GetUser for the caller, then
  # GetGroup for each of their managedGroupIds: the platform groups the
  # signed-in caller is a LOCAL group-manager of, sorted by name, for the
  # "My Groups" editor. Any signed-in caller; only their own grants are read.
  # Members come from managedGroupMembers.
  myManagedGroups: [PlatformGroup!]!
}

# An identity platform group: a node in identity's group tree that users are
# members of.
type PlatformGroup {
  id: ID!
  name: String!
  # Null for a root group.
  parentId: ID
}

extend type Mutation {
  grantRole(userId: ID!, role: String!, category: String): User!
  revokeRole(userId: ID!, role: String!, category: String): User!
  enableUser(userId: ID!): User!
  disableUser(userId: ID!): User!
  # reassignUserPolicies -> PolicyService.ReassignUserPolicies: bulk-transfers
  # every policy owned by fromUserId to toUserId AND rewrites that user's category
  # RACI author grants to toUserId, in one auditable admin op. Used to clear a
  # user's "orphaned set" before deletion. Site-admin only. Never deletes a policy.
  reassignUserPolicies(fromUserId: ID!, toUserId: ID!): ReassignUserPoliciesResult!
  # deleteUser -> soft-deletes a user via IdentityAdminService.DeleteUser AFTER
  # verifying (via policiesByOwner) that the user owns no policies — if any remain,
  # the call is REJECTED (reassign first). Policies are NEVER deleted; they live in
  # core and stay orphaned for re-assignment. Revokes the user's sessions and drops
  # their identity-owned access rows. Site-admin only.
  deleteUser(userId: ID!): DeleteUserResult!
  # mergeAccounts -> IdentityAdminService.MergeAccounts: merges sourceUserId INTO
  # targetUserId (owned policies re-pointed, RACI grants rewritten, acknowledgments
  # moved/deduped, workflow items reassigned, preferences moved) in one auditable
  # admin op. The actor is the signed-in user. confirmPrivileged must be true
  # when the preview's requiresPrivilegedConfirm is set; idempotencyKey makes the
  # op safe to retry (re-run with the same key to resume a PARTIAL). Site-admin only.
  mergeAccounts(sourceUserId: ID!, targetUserId: ID!, confirmPrivileged: Boolean, idempotencyKey: String): MergeAccountsResult!
  # createPlatformGroup -> IdentityAdminService.CreateGroup: a new identity
  # platform group under parentId (a root group when it is null). The name is
  # trimmed and must not be blank. Site-admin only.
  createPlatformGroup(name: String!, parentId: ID): PlatformGroup!
  addUserToGroup(userId: ID!, groupId: ID!): User!
  removeUserFromGroup(userId: ID!, groupId: ID!): User!
  # grantGroupManager -> IdentityAdminService.GrantGroupManager: makes userId a
  # LOCAL group-manager of groupId. Site-admin only — granting the
  # manager role is not itself something a group-manager may do; managers only
  # manage membership. Idempotent; returns the refreshed user.
  grantGroupManager(userId: ID!, groupId: ID!): User!
  # revokeGroupManager -> IdentityAdminService.RevokeGroupManager: removes a
  # user's group-manager grant on groupId. Site-admin only; idempotent.
  revokeGroupManager(userId: ID!, groupId: ID!): User!
  setUserPolicyOverride(userId: ID!, policyNumber: String!, effect: OverrideEffect): User!
  # Emails a one-time confirmation code to the CALLING admin's own address
  # (server-bound from the session, never from input). Arm this before
  # transferRoot; the emailed code must then be passed as transferRoot(otp:).
  # Always returns true (anti-enumeration).
  requestStepUpOtp: Boolean!
  # Moves the protected root site-admin to another user. Only the current
  # root may call this; the target is granted site-admin + admin. Requires the
  # one-time code emailed by requestStepUpOtp, which the backend verifies
  # server-side before transferring — an invalid/absent code transfers nothing.
  transferRoot(toUserId: ID!, otp: String!): User!
  # Completes the CALLING user's first-run onboarding (caller-scoped self-service,
  # bound from the session — never from input; available to any authenticated
  # user, not just admins). acceptTerms MUST be true (else the call is rejected).
  # firstName/lastName/email optionally set the profile fields the user confirmed
  # or edited on the /welcome page (only the fields the IdP left empty are
  # editable); username optionally sets a new login username (must be unique). The
  # display name is NOT collected here — it is DERIVED server-side from
  # firstName + lastName. Marks the user onboarded so needsOnboarding flips to
  # false. Returns the updated user.
  completeOnboarding(acceptTerms: Boolean!, username: String, firstName: String, lastName: String, email: String): User!
  # updateMyProfile lets the CALLING user edit their OWN name and language
  # preference from account settings.
  # Self-service — bound to the context actor, NOT admin-gated, and it never
  # takes a userId (the admin path for editing OTHER users is
  # updateUserProfile). Every argument is optional: an omitted field is left
  # unchanged, a present one is set. The display name is NOT an input — it is
  # DERIVED server-side from firstName + lastName. Works for SSO/JIT users
  # (whose IdP may not supply a name) and local users alike. Returns the
  # updated user.
  #
  # locale is the account-level BCP-47 language tag. It is VALIDATED at
  # the gateway before it is forwarded: only language[-Script][-REGION] is
  # accepted ("en", "en-US", "zh-Hant-TW", "es-419"); anything else is refused
  # with the coded business error PROFILE_LOCALE_INVALID (1241) and nothing is
  # written. Passing an empty/whitespace-only string CLEARS the preference back
  # to unset; omitting it leaves the stored value untouched.
  updateMyProfile(firstName: String, lastName: String, locale: String): User!
}

# Result of reassignUserPolicies: the policies whose owner moved,
# plus counts for the owner reassignment and the category RACI author-grant sweep.
type ReassignUserPoliciesResult {
  reassignedPolicyIds: [ID!]!
  reassignedOwnerCount: Int!
  reassignedAuthorGrants: Int!
}

# Result of deleteUser: the deleted user's id and how many active
# sessions were revoked by the soft-delete.
type DeleteUserResult {
  userId: ID!
  revokedSessions: Int!
}

# --- Account merge ---
# The kind of thing a merge preview line item represents.
enum MergeItemKind { POLICY_OWNER RACI_GRANT ACKNOWLEDGMENT WORKFLOW_ITEM PREFERENCE }

# A single line in the merge preview: what would move, with a human label/detail.
type MergePreviewItem { kind: MergeItemKind!  refId: ID!  label: String!  detail: String! }

# Aggregate counts of what a merge would move/dedupe.
type MergeCounts { policiesOwned: Int!  raciGrants: Int!  acknowledgmentsMoved: Int!  acknowledgmentsDeduped: Int!  workflowItems: Int!  preferences: Int! }

# A non-fatal advisory surfaced on the preview (e.g. a dedupe or a manual-review note).
type MergeWarning { code: String!  message: String! }

# Read-only projection of merging sourceUserId INTO targetUserId (previewAccountMerge).
type AccountMergePreview { sourceUserId: ID!  targetUserId: ID!  counts: MergeCounts!  items: [MergePreviewItem!]!  warnings: [MergeWarning!]!  requiresPrivilegedConfirm: Boolean! }

# --- User deletion preview ---
# What a user-deletion preview line is. A delete has no target account, so
# nothing moves: each kind is blocked, orphaned or removed.
enum DeletionItemKind {
  PENDING_APPROVAL  # an approval seat the account still holds; blocks the delete
  OWNED_POLICY      # a policy left orphaned for re-assignment
  RACI_GRANT        # a user-subject category RACI rule the delete purges
  ACCESS_ROW        # a role, permission, group membership, IdP group, per-policy override or break-glass grant that is dropped
  CREDENTIAL        # the account's local-login credential, revoked before the tombstone
}

# One reviewable line in the deletion preview. blocksDelete marks the rows that
# make deleteUser refuse until they are cleared.
type UserDeletionPreviewItem { kind: DeletionItemKind!  refId: ID!  label: String!  detail: String!  blocksDelete: Boolean! }

# Per-class counts. managedGroups is the one class the delete does NOT remove:
# group-manager grants stay behind pointing at the tombstone (see the
# RETAINED_MANAGED_GROUPS warning).
type UserDeletionCounts { pendingApprovals: Int!  ownedPolicies: Int!  raciGrants: Int!  roles: Int!  permissions: Int!  groupMemberships: Int!  idpGroups: Int!  policyOverrides: Int!  breakGlassGrants: Int!  managedGroups: Int! }

# code is stable: DELETE_BLOCKED_PENDING_APPROVALS | DELETE_BLOCKED_ROOT_PROTECTED |
# POLICIES_ORPHANED | RACI_GRANTS_REMOVED | RETAINED_MANAGED_GROUPS |
# LAST_LOCAL_CREDENTIAL | NO_LOCAL_CREDENTIAL | ALREADY_DELETED. message is user-safe prose.
type UserDeletionWarning { code: String!  message: String! }

# Read-only projection of deleting userId (previewUserDeletion). blocksDelete is
# true when deleteUser would refuse right now. locallyAuthenticable reports
# whether the account can sign in without the IdP today (local account,
# credential-store password or passkey); with LAST_LOCAL_CREDENTIAL it signals
# that the delete changes how the person can get in.
type UserDeletionPreview { userId: ID!  counts: UserDeletionCounts!  items: [UserDeletionPreviewItem!]!  warnings: [UserDeletionWarning!]!  blocksDelete: Boolean!  locallyAuthenticable: Boolean! }

# Terminal outcome of a merge: COMPLETED (all steps), PARTIAL (some failed;
# re-run with the same idempotencyKey to resume), FAILED (nothing durably applied).
enum MergeStatus { COMPLETED PARTIAL FAILED }

# Per-step outcome within a merge.
enum MergeStepStatus { PENDING COMPLETED FAILED SKIPPED }

# The result of one step in a merge operation.
type MergeStepResult { step: String!  status: MergeStepStatus!  detail: String!  error: String! }

# Result of mergeAccounts: the operation id, overall status, the
# counts actually applied, and the per-step results.
type MergeAccountsResult { mergeOperationId: ID!  status: MergeStatus!  counts: MergeCounts!  steps: [MergeStepResult!]! }


# --- Session management ---
# Backed by identity's session API (IdentityAdminService / IdentityReadService).
# listUserSessions + revokeUserSessions are admin-gated (site-admin).
# revokeMySessions is self-service (any authenticated user).

type Session {
  sessionId: ID!
  userId: ID!
  issuedAt: String!
  # When the session last authenticated (sign-in or step-up).
  authenticatedAt: String!
  expiresAt: String!
  active: Boolean!
  userAgent: String!
  # The IP address of the device that last used the session; null when Kratos
  # recorded none for it.
  clientIp: String
  # When the session was last used for a signed-in request (RFC 3339, to within
  # identity's throttle window); null when it was never seen.
  lastSeenAt: String
}

extend type Query { listUserSessions(userId: ID!): [Session!]! }

extend type Mutation {
  revokeUserSessions(userId: ID!, reason: String): Int!
  revokeMySessions: Int!
}

# --- Local accounts ---
# Admin-gated (user.manage) at the gateway and in identity.

extend type Mutation {
  createLocalUser(username: String!, email: String!, name: String!, password: String!): User!
  resetUserPassword(userId: ID!, newPassword: String!): Boolean!
  # Re-send the welcome-account onboarding email to a user (admin action).
  resendWelcomeEmail(userId: ID!): Boolean!
  updateUserProfile(userId: ID!, name: String!, email: String!): User!
}


# --- Second-factor management ---
# Factor-management surface consumed by the enrollment widget. EVERY operation
# acts on the AUTHENTICATED CALLER'S OWN factors: the user id is sourced from
# the session claims server-side — there is deliberately no userId argument —
# and any authenticated user may manage their own factors (same gate as `me`).
# Backed by identity (IdentityReadService MFA + WebAuthn RPCs).

# One second factor the caller can satisfy. kind: "totp" | "email" | "passkey".
# enrolledAt: RFC3339 activation time; null for implicit factors (email).
# label: the user-set display name; null/empty = show the client default name
# for the kind. Only the singleton totp factor carries a stored label here
# (rename via renameMfaMethod with methodId "totp"); per-passkey labels are on
# WebauthnCredentialInfo, and the implicit email factor is never labelled.
type UserFactor {
  kind: String!
  enrolledAt: String
  label: String
}

# One registered passkey (WebAuthn credential). id is the base64url credential
# id (the removeWebauthnCredential key); lastUsedAt is null when never used;
# transports are authenticator hints (usb, nfc, ble, internal, hybrid).
type WebauthnCredentialInfo {
  id: ID!
  label: String
  createdAt: String!
  lastUsedAt: String
  transports: [String!]
}

# TOTP enrollment material. otpauthUri is the otpauth://totp/... provisioning
# URI the widget renders as a QR — it embeds the full secret: show it once,
# never persist it. secretMasked is a redacted hint for confirmation UI copy.
type TotpEnrollment {
  otpauthUri: String!
  secretMasked: String
}

# WebAuthn registration ceremony material. optionsJson is the opaque
# PublicKeyCredentialCreationOptions JSON for navigator.credentials.create().
# NOTE: unlike the login assert flow, the sessionId IS returned to the client
# here — the enrolling user is already session-authenticated, so handing back
# the server-side ceremony handle carries no pre-auth enumeration risk.
type WebauthnRegistration {
  optionsJson: String!
  sessionId: ID!
}

extend type Query {
  # The caller's enrolled second factors.
  myFactors: [UserFactor!]!
  # The caller's registered passkeys.
  myWebauthnCredentials: [WebauthnCredentialInfo!]!
}

extend type Mutation {
  # Starts (or restarts) TOTP enrollment for the caller.
  enrollTotpBegin: TotpEnrollment!
  # Activates the pending TOTP enrollment by proving possession with a current code.
  enrollTotpConfirm(code: String!): Boolean!
  # Emails the caller a short-lived single-use enrollment code (purpose="enroll").
  sendEnrollEmailOtp: Boolean!
  # Verifies the emailed enrollment code (purpose="enroll"); true iff valid,
  # unexpired, unconsumed and within the attempt limit (consumed on success).
  verifyEnrollEmailOtp(code: String!): Boolean!
  # Starts a passkey registration ceremony (see WebauthnRegistration).
  webauthnRegisterBegin: WebauthnRegistration!
  # Completes a passkey registration ceremony; label is a user-facing name for
  # the new credential.
  webauthnRegisterFinish(sessionId: ID!, credentialJson: String!, label: String): Boolean!
  # Removes the caller's credential for the given kind. "totp" deletes the TOTP
  # enrollment; "passkey" deletes ALL passkeys (use removeWebauthnCredential
  # for a single one). "email" cannot be removed (implicit factor).
  removeFactor(kind: String!): Boolean!
  # Removes a single passkey by its credential id (from myWebauthnCredentials).
  removeWebauthnCredential(credentialId: ID!): Boolean!
  # Renames one of the caller's enrolled second-factor methods. methodId "totp"
  # relabels the authenticator factor (from myFactors); any other value is a
  # passkey credential id (from myWebauthnCredentials). An empty label clears it
  # back to the default. The implicit "email" factor cannot be labelled.
  renameMfaMethod(methodId: ID!, label: String!): Boolean!
}


# ---------------------------------------------------------------------------
# Admin MFA factor management
#
# The ADMIN side of the shared profile Security tab: a site-admin views, resets
# (removes) and relabels a TARGET user's second factors. Distinct from the
# caller-scoped self-service surface (myFactors / removeFactor /
# renameMfaMethod), these take the target userId and are site-admin gated. The
# admin view is per-factor addressable (one MfaFactor per passkey), unlike the
# aggregated self-service UserFactor list, so a shared UI component can drive
# both self and admin modes off the same factor shape.
# ---------------------------------------------------------------------------

# One of a user's second factors, from the ADMIN Security tab view. id is the
# stable method id addressing the factor for the admin remove/rename mutations:
# "totp" for the authenticator factor, a passkey credential id for a passkey, or
# "email" for the implicit email factor. enrolledAt is RFC3339 (null for the
# implicit email factor); label is the user-facing name (null/empty = default).
type MfaFactor {
  id: ID!
  kind: String!
  enrolledAt: String
  label: String
}

extend type Query {
  # Admin: lists the target user's enrolled second factors for the Security tab.
  # Site-admin only (UserManage). Each factor's id addresses it for the
  # remove/rename mutations below.
  userFactors(userId: ID!): [MfaFactor!]!
}

extend type Mutation {
  # Admin: removes (resets) one of the target user's factors so they can
  # re-enroll. methodId "totp" removes the authenticator factor; any other value
  # is a passkey credential id and removes that single passkey. The implicit
  # "email" factor cannot be removed. Site-admin only (UserManage).
  removeUserMfaFactor(userId: ID!, methodId: ID!): Boolean!
  # Admin: relabels one of the target user's factors. methodId "totp" or a
  # passkey credential id; an empty label clears it back to the default. The
  # implicit "email" factor cannot be labelled. Site-admin only (UserManage).
  renameUserMfaFactor(userId: ID!, methodId: ID!, label: String!): Boolean!
}

# Site-admin "act as user" (impersonation). A site-admin starts a time-boxed,
# audited session acting as a non-privileged target user, assuming that user's
# roles/RACI with full write capability. The record lives on the admin's
# server-side BFF session (single source of truth) and auto-expires after 30
# minutes.
type ImpersonationSession {
  # The user being acted as.
  targetUserId: ID!
  # The target's display name (for the banner).
  targetName: String!
  # The required justification captured at start.
  reason: String!
  # RFC3339 start / expiry timestamps (30-minute window).
  startedAt: String!
  expiresAt: String!
}

extend type Query {
  # The caller's active impersonation, or null when they are not impersonating
  # (or the record has expired). Drives the persistent "acting as" banner.
  impersonationStatus: ImpersonationSession
}

extend type Mutation {
  # Site-admin: begin acting as userId. Gated on the REAL caller being a
  # site-admin; the target must exist and must NOT be a site-admin or root;
  # reason must be non-empty; rejected if the caller is already impersonating
  # (no nesting). Records the impersonation on the admin's BFF session and
  # emits an impersonation.started audit event attributed to the admin.
  startImpersonation(userId: ID!, reason: String!): ImpersonationSession!
  # Stop acting as another user: clears the record and emits
  # impersonation.stopped. Returns true once cleared.
  stopImpersonation: Boolean!
}


# ---- graphql/live.graphqls
# --- Live updates: GraphQL subscriptions over websocket ---
type LiveEvent {
  type: String!        # audit action, e.g. "category.created", "policy.published"
  entityId: String     # subject, e.g. "category:<uuid>" / "policy_version:<uuid>"
  groupId: String
  actorUserId: String
  at: String!          # RFC3339 timestamp
}

extend type Subscription {
  # Streams domain-change events so clients can refetch affected data live.
  # It carries every audit event, so it needs the audit log's read permission
  # (audit.read); anyone else is refused with PermissionDenied. `topics`
  # filters by prefix on `type` (e.g. ["category.", "policy."]); omit or pass
  # empty for all events.
  liveEvents(topics: [String!]): LiveEvent!
}



# ---- graphql/obligations.graphqls
# --- Compliance: acknowledgments, obligations, notification prefs, reporting ---
# Backed by obligations (AckService, ObligationService, NotifPrefService,
# ReportingService). The actor is always the signed-in user, never taken from
# input.

type Obligation {
  policyId: ID!
  number: String!
  title: String!
  version: String!
  policyVersionId: ID!
}

type Acknowledgment {
  id: ID!
  userId: ID!
  policyVersionId: ID!
  ackedAt: String!
}

type AckStatus {
  acknowledged: Boolean!
  ackedAt: String   # ISO-8601; null when acknowledged=false
}

type NotificationPref {
  userId: ID!
  email: Boolean!
  inApp: Boolean!
  push: Boolean!
}

input NotificationPrefInput {
  email: Boolean!
  inApp: Boolean!
  push: Boolean!
}

# Per-user notification cadence model. The caller is always the signed-in
# user.
enum NotifCadence { IMMEDIATE DAILY WEEKLY OFF }
enum NotifCategory { COMPLIANCE SECURITY TRANSACTIONAL WORKFLOW INFORMATIONAL }

# A category's resolved cadence. mandatory=true (compliance/security/
# transactional) means the UI must not offer OFF — the server rejects it.
type CategoryPref { category: NotifCategory! cadence: NotifCadence! mandatory: Boolean! }

# How the system realizes a chosen cadence for a notification type. Never
# user-editable. This is a client's ONLY reliable per-type cadence floor:
# setTypeCadence rejects OFF for mandatory kinds but still ACCEPTS DAILY/WEEKLY
# for an IMMEDIATE_ONLY kind and clamps it at send time, so a UI must read this
# rather than infer batchability from `mandatory`.
enum NotifDelivery {
  # Sent the instant the event fires, never batched (transactional/security/
  # critical, plus the locked first ack demand). Do not offer DAILY/WEEKLY.
  IMMEDIATE_ONLY
  # Immediate when the cadence is IMMEDIATE, else rolled into the digest.
  IMMEDIATE_OR_DIGEST
  # Recurring compliance driven by the scheduler, or folded into the
  # pending-ack digest when a digest cadence is chosen.
  REMINDER_SCHEDULE
  # Defaults to the daily roll-up; IMMEDIATE is allowed but discouraged.
  DIGEST_PREFERRED
}

# An advanced per-type override, carrying the type's category + mandatory flag
# and the system's delivery policy for that kind.
type TypePref { kind: String! category: NotifCategory! cadence: NotifCadence! mandatory: Boolean! delivery: NotifDelivery! }

# One row of the notification-type taxonomy: the system's classification of a
# notification kind, independent of any user's stored choices. Display labels
# for the individual kinds are presentation and live in the UI, not here.
type NotifTypeDef { kind: String! category: NotifCategory! mandatory: Boolean! delivery: NotifDelivery! }
# The user's digest delivery anchor: local hour [0,23], ISO day-of-week [1,7].
type DigestWindow { dailyHour: Int! weeklyDow: Int! }

type NotificationSettings {
  channels: NotificationPref!         # existing email/inApp/push master switches
  categories: [CategoryPref!]!        # the primary control
  overrides: [TypePref!]!             # advanced per-type overrides
  digest: DigestWindow!
}

type OverdueEntry { userId: ID! email: String! userName: String }
type CompletionReport {
  totalAudience: Int!
  totalAcked: Int!
  completionPct: Float!
  avgDaysToAck: Float!
  viewedNotAckedCount: Int!
  overdue: [OverdueEntry!]!
}

type AckRosterEntry { userId: ID! email: String! userName: String ackedAt: String }
type AckRoster { acked: [AckRosterEntry!]! pending: [AckRosterEntry!]! }
type AckActivityDay { date: String! acks: Int! views: Int! }

# Per-caller acknowledgement compliance summary: how many policies the caller is
# obligated to ack (required) and how many of those they have already acked
# (done). Backs the "Acknowledgement compliance" widget on My work.
type AckSummary { required: Int! done: Int! }

type AckExport {
  # base64-encoded payload as produced by ReportingService.ExportAcks.
  data: String!
  contentType: String!
}

extend type Query {
  myObligations: [Obligation!]!
  myAckSummary: AckSummary!
  obligatedAudienceCount(policyId: ID!): Int!
  ackStatus(policyVersionId: ID!): AckStatus!
  notificationPref: NotificationPref! @deprecated(reason: "Use notificationSettings.channels")
  notificationSettings: NotificationSettings!
  # The notification-type taxonomy: every type the platform sends. Reference
  # data, identical for every caller. A preferences UI needs this in addition
  # to notificationSettings because `overrides` carries only the per-type
  # choices a user has already saved — empty for a new user.
  notificationTypeCatalog: [NotifTypeDef!]!
  completionReport(policyVersionId: ID!, groupId: ID): CompletionReport!
  exportAcks(policyVersionId: ID!, format: String!): AckExport!
  ackRoster(policyVersionId: ID!, groupId: ID): AckRoster!
  ackActivity(policyVersionId: ID!, groupId: ID, days: Int!): [AckActivityDay!]!
}

extend type Mutation {
  recordAck(policyVersionId: ID!): Acknowledgment!
  upsertNotificationPref(input: NotificationPrefInput!): NotificationPref! @deprecated(reason: "Use setNotificationChannels")
  # Notification cadence model. The server rejects OFF for mandatory categories/
  # types (compliance/security/transactional) — the compliance floor.
  setCategoryCadence(category: NotifCategory!, cadence: NotifCadence!): NotificationSettings!
  setTypeCadence(kind: String!, cadence: NotifCadence!): NotificationSettings!
  setDigestWindow(dailyHour: Int!, weeklyDow: Int!): NotificationSettings!
  setNotificationChannels(input: NotificationPrefInput!): NotificationSettings!
  recordView(policyVersionId: ID!): Boolean!
}



# ---- graphql/reporting.graphqls
# --- Reporting: concerns from reporters, case work for officers ---
# Backed by reporting (IntakeService, CaseService). Field for field the
# reporting API; reporting decides who is an officer.
#
# Anonymous operations (submitAnonymousReport, checkReport, replyToReport)
# work signed out, and a signed-in user may use them too: the gateway calls
# reporting as itself for them and sends nothing that identifies the caller.
# checkReport and replyToReport are throttled per case code and overall.
# checkReport is a mutation so the passphrase is never part of a GET URL.

enum CaseStatus { NEW IN_REVIEW NEEDS_REPORTER_REPLY RISK_ASSESSMENT NOTIFICATION_DUE CLOSED }
enum ReportKind { ANONYMOUS NAMED }
enum InformationKind { HEALTH CONTACT FINANCIAL NOT_SURE }
enum ReportAnswer { YES NO NOT_SURE }
enum MessageAuthor { REPORTER OFFICER }
enum RiskRecipient { STAFF_ONLY UNKNOWN_PEOPLE ANOTHER_ORGANISATION }
enum RiskViewed { YES PROBABLY NO }
enum RiskMitigation { FULLY PARTLY NOT_AT_ALL }
enum RiskSuggestion { NOTIFICATION_LIKELY_REQUIRED LOW_PROBABILITY_OF_COMPROMISE }
enum BreachDecision { REPORTABLE NOT_REPORTABLE }
enum NoticeRecipient { AFFECTED_PEOPLE REGULATOR MEDIA OTHER }
enum NoticeStatus { NOT_SENT DRAFT SENT NOT_NEEDED }
enum CaseOutcome { SUBSTANTIATED NOT_SUBSTANTIATED INCONCLUSIVE }

# What the reporter tells us. Nothing here asks who the reporter is.
type ReportDetails {
  whatHappened: String!
  occurred: String!          # in the reporter's words
  location: String!
  informationKinds: [InformationKind!]!
  stillHappening: ReportAnswer   # null when not answered
}

input ReportDetailsInput {
  whatHappened: String!
  occurred: String
  location: String
  informationKinds: [InformationKind!]
  stillHappening: ReportAnswer
}

# A file sent with a report. reporting strips its metadata and takes JPEG,
# PNG, GIF and plain text only, up to three of 10 MB each.
input ReportAttachmentInput {
  filename: String!
  contentType: String!
  data: String!              # base64
}

type ThreadMessage {
  id: ID!
  author: MessageAuthor!
  officerUserId: ID          # officers' view only; never sent to a reporter
  body: String!
  createdAt: String!         # RFC3339
}

# Everything a reporter may see of their report.
type ReporterView {
  caseCode: String!
  status: CaseStatus!
  details: ReportDetails!
  thread: [ThreadMessage!]!
  receivedAt: String!        # RFC3339
}

type AnonymousReportReceipt {
  caseCode: String!          # shown once, grouped in threes
}

type NamedReportReceipt {
  caseId: ID!
  caseCode: String!
}

type MyReport {
  caseId: ID!
  report: ReporterView!
}

type ReportAttachment {
  id: ID!
  filename: String!
  contentType: String!
  sizeBytes: Int!
  metadataStripped: Boolean!
}

type ReportAttachmentContent {
  attachment: ReportAttachment!
  data: String!              # base64
}

type CaseNote {
  id: ID!
  authorUserId: ID!
  body: String!
  createdAt: String!         # RFC3339
}

type RiskFactors {
  information: [InformationKind!]!
  recipient: RiskRecipient
  viewed: RiskViewed
  mitigation: RiskMitigation
}

input RiskFactorsInput {
  information: [InformationKind!]!
  recipient: RiskRecipient!
  viewed: RiskViewed!
  mitigation: RiskMitigation!
}

type RiskAssessment {
  factors: RiskFactors!
  suggestion: RiskSuggestion
  decision: BreachDecision
  reason: String!
  decidedByUserId: ID!
  decidedAt: String!         # RFC3339
}

type CaseNotice {
  id: ID!
  recipient: NoticeRecipient!
  label: String!
  method: String!
  daysAllowed: Int!
  dueOn: String!             # YYYY-MM-DD
  status: NoticeStatus!
  sentOn: String             # YYYY-MM-DD, once sent
}

type CorrectiveAction {
  description: String!
  policyId: ID               # the core policy the action changes
}

input CorrectiveActionInput {
  description: String!
  policyId: ID
}

type CaseSummary {
  id: ID!
  caseCode: String!
  kind: ReportKind!
  status: CaseStatus!
  summary: String!
  assigneeUserId: ID
  receivedAt: String!        # RFC3339
  nextDeadline: String       # YYYY-MM-DD
}

type CaseStatusCount {
  status: CaseStatus!
  count: Int!
}

type CaseQueue {
  cases: [CaseSummary!]!
  counts: [CaseStatusCount!]!   # over every case, whatever the filter
}

type ReportCase {
  id: ID!
  caseCode: String!
  kind: ReportKind!
  status: CaseStatus!
  details: ReportDetails!
  reporterUserId: ID         # named reports only
  assigneeUserId: ID
  receivedAt: String!        # RFC3339
  discoveredOn: String       # YYYY-MM-DD
  attachments: [ReportAttachment!]!
  thread: [ThreadMessage!]!
  notes: [CaseNote!]!
  assessment: RiskAssessment # the latest
  notices: [CaseNotice!]!
  outcome: CaseOutcome
  correctiveActions: [CorrectiveAction!]!
  closedAt: String           # RFC3339
}

extend type Query {
  # The signed-in user's own named reports.
  myReports: [MyReport!]!
  myReport(caseId: ID!): ReporterView!
  # Officers only.
  reportCases(statuses: [CaseStatus!], assigneeUserId: ID): CaseQueue!
  reportCase(caseId: ID!): ReportCase!
  reportAttachment(caseId: ID!, attachmentId: ID!): ReportAttachmentContent!
}

extend type Mutation {
  # Anonymous: work signed out.
  submitAnonymousReport(details: ReportDetailsInput!, passphrase: String!, attachments: [ReportAttachmentInput!]): AnonymousReportReceipt!
  checkReport(caseCode: String!, passphrase: String!): ReporterView!
  replyToReport(caseCode: String!, passphrase: String!, body: String!): ReporterView!

  # Named: the signed-in user.
  submitNamedReport(details: ReportDetailsInput!, attachments: [ReportAttachmentInput!]): NamedReportReceipt!
  replyToMyReport(caseId: ID!, body: String!): ReporterView!

  # Officers only.
  postCaseMessage(caseId: ID!, body: String!): ThreadMessage!
  addCaseNote(caseId: ID!, body: String!): CaseNote!
  # A null assigneeUserId clears the assignee.
  assignCase(caseId: ID!, assigneeUserId: ID): ReportCase!
  # Any status but CLOSED; closing goes through closeCase.
  setCaseStatus(caseId: ID!, status: CaseStatus!): ReportCase!
  setCaseDiscoveryDate(caseId: ID!, discoveredOn: String!): ReportCase!
  recordRiskAssessment(caseId: ID!, factors: RiskFactorsInput!, decision: BreachDecision!, reason: String!): RiskAssessment!
  addCaseNotice(caseId: ID!, recipient: NoticeRecipient!, label: String, method: String): CaseNotice!
  # sentOn (YYYY-MM-DD) is required with SENT.
  updateCaseNotice(caseId: ID!, noticeId: ID!, status: NoticeStatus!, sentOn: String): CaseNotice!
  closeCase(caseId: ID!, outcome: CaseOutcome!, correctiveActions: [CorrectiveActionInput!], closingMessage: String): ReportCase!
}

# ---- graphql/sso.graphqls
# ---------------------------------------------------------------------------
# SSO admin (SAML/OIDC organization connections) — site-admin only.
# Backed by the identity IdentitySSOAdminService. An Organization is one email
# domain's SSO connection: unverified, untested and disabled until the domain is
# verified and the IdP connection is tested. Group mappings translate asserted
# IdP group-claim values to platform groups; the SP certificate is the SAML
# service-provider signing key (rotated in place).
# ---------------------------------------------------------------------------

# One organization SSO connection, keyed by email domain.
type Organization {
  domain: String!
  orgName: String!
  protocol: String!
  displayName: String!
  # The connection alias. /auth/sso/start?connection=<alias> matches it
  # against identity Discover.
  connectionAlias: String!
  verified: Boolean!
  testPassed: Boolean!
  enabled: Boolean!
  connectionId: ID!
  # When true (default), a first-seen SSO user is auto-provisioned on sign-in
  #. When false, only a pre-provisioned platform user may sign in
  # via SSO; an unknown SSO email is refused.
  jitEnabled: Boolean!
  # When true, this org's users may sign in with a local password as a fallback
  # even while SSO is configured. Defaults false (SSO-only).
  allowLocal: Boolean!
}

# One SP (service-provider) signing certificate. notAfter is RFC3339; active is
# true for at most one certificate at a time.
type SpCertificate {
  serial: String!
  certPem: String!
  spMetadataXml: String!
  notAfter: String!
  active: Boolean!
}

# Maps a single asserted IdP group-claim value to a platform group by id. Group
# names are unique only per-parent, so the target is a group id (UUID) to avoid
# granting the wrong same-named group during JIT provisioning.
type GroupMapping {
  id: ID!
  connectionId: ID!
  idpGroupClaimValue: String!
  targetGroupId: ID!
}

# DNS TXT domain-verification challenge minted by startDomainVerification: add a
# TXT record named dnsRecordName with value dnsRecordValue, then call verifyDomain.
type DomainVerification {
  token: String!
  dnsRecordName: String!
  # Exact TXT value to publish (<prefix>=<token>); the prefix is an identity
  # setting.
  dnsRecordValue: String!
  instructions: String!
}

# A single IdP connection config entry (e.g. SAML entityId/ssoUrl/x509cert or
# OIDC issuer/clientId). Passed as a list because GraphQL has no map type.
input KeyValueInput {
  key: String!
  value: String!
}

# New organization SSO connection. The actor is bound from the caller's claims
# at the gateway (never from input). config carries protocol-specific IdP
# connection settings; secretRef names the stored client secret (OIDC).
input AddOrganizationInput {
  orgName: String!
  domain: String!
  protocol: String!
  displayName: String
  config: [KeyValueInput!]
  secretRef: String
}

extend type Query {
  # All configured organization SSO connections.
  organizations: [Organization!]!
  # A single organization SSO connection by email domain, or null if none.
  organization(domain: String!): Organization
  # The active SP (service-provider) signing certificate.
  spCertificate: SpCertificate!
  # All SP signing certificates (history); the active one is included.
  spCertificates: [SpCertificate!]!
  # An organization's IdP-group-claim-to-platform-group mappings.
  groupMappings(connectionId: ID!): [GroupMapping!]!
}

extend type Mutation {
  # Register a new organization SSO connection (unverified, untested, disabled
  # until the domain is verified and the IdP connection is tested).
  addOrganization(input: AddOrganizationInput!): Organization!
  # Mint a DNS TXT verification challenge for a domain. The token is stable by
  # default (re-calling returns the same token). Pass rotate: true to mint a
  # fresh token — the one explicit action that changes it, which also revokes
  # the domain's prior verified proof.
  startDomainVerification(domain: String!, rotate: Boolean): DomainVerification!
  # Check the domain's DNS TXT record against its verification token; returns
  # the updated organization.
  verifyDomain(domain: String!): Organization!
  # Enable an organization's SSO connection for login.
  activateOrganization(domain: String!): Organization!
  # Disable an organization's SSO connection.
  disableOrganization(domain: String!): Organization!
  # Update an organization's per-org login toggles: jitEnabled
  # and allowLocal. Each argument is optional — omit one to leave
  # it unchanged and flip only the other.
  updateIdPConnection(domain: String!, jitEnabled: Boolean, allowLocal: Boolean): Organization!
  # Change an organization's IdP protocol (SAML<->OIDC). DESTRUCTIVE: it
  # re-provisions the backend IdP for the new protocol and resets the org to the
  # start — clearing both gates (verified + testPassed) and disabling the
  # connection — so the domain must be re-verified and the IdP re-tested before
  # re-activation. config carries the new protocol's IdP settings; secretRef
  # names the stored client secret (OIDC).
  changeOrgProtocol(domain: String!, protocol: String!, config: [KeyValueInput!], secretRef: String): Organization!
  # Remove an organization SSO connection.
  deleteOrganization(domain: String!): Boolean!
  # Add an IdP-group-claim-to-platform-group mapping for a connection.
  addGroupMapping(connectionId: ID!, idpGroupClaimValue: String!, targetGroupId: ID!): GroupMapping!
  # Remove a group mapping by id.
  deleteGroupMapping(mappingId: ID!): Boolean!
  # Mint a new SP signing certificate and activate it immediately, superseding
  # the previous one.
  forceRotateSpCertificate: SpCertificate!
}



# ---- graphql/workflow.graphqls
# --- Workflow: approval-saga submit/signal/status/pending-tasks ---
# Backed by workflow (WorkflowService). The caller is the signed-in user:
# submitWorkflow's submitter, signalWorkflow's actor and pendingTasks's
# approver filter are never taken from input.
# The schema therefore omits actor / approver / submitter inputs.

enum ApprovalStatus {
  APPROVAL_STATUS_UNSPECIFIED
  APPROVAL_STATUS_DRAFT
  APPROVAL_STATUS_IN_REVIEW
  APPROVAL_STATUS_APPROVED
  APPROVAL_STATUS_SCHEDULED
  APPROVAL_STATUS_PUBLISHED
  APPROVAL_STATUS_SUPERSEDED
  APPROVAL_STATUS_REJECTED
  APPROVAL_STATUS_WITHDRAWN
  APPROVAL_STATUS_ARCHIVED
}

enum SignalType {
  SIGNAL_TYPE_UNSPECIFIED
  SIGNAL_TYPE_APPROVE
  SIGNAL_TYPE_REJECT
  SIGNAL_TYPE_REQUEST_CHANGES
  SIGNAL_TYPE_WITHDRAW
  SIGNAL_TYPE_RETIRE
}

type WorkflowSubmitResult {
  runId: String!
}

# One current assignee on a stage, from the authoritative approval_assignments
# row (who must approve + their state/comment/time) — NOT the assignmentHistory
# audit log, whose `created` actor is the submitter.
type StageAssignee {
  userId: String!
  # Resolved display name (nil when the directory can't resolve it — the client
  # falls back to a short id).
  name: String
  # pending / approved / rejected.
  state: String!
  # Decision comment, present once decided.
  comment: String
  # ISO-8601 decision timestamp, present once decided.
  decidedAt: String
  # The group whose seat this is, when the user holds a group seat; null for
  # an individual seat.
  groupId: ID
}

# One approve-as-group unit's live tally on a stage. groupName is
# resolved by the gateway from groupId.
type StageUnitProgress {
  groupId: String!
  groupName: String
  quorum: String!    # one | majority | all
  required: Int!     # approvals needed to satisfy the internal quorum
  approvals: Int!
  pending: Int!      # members still able to approve
  roster: Int!       # total member roster size
  status: String!    # SATISFIED | PENDING | REJECTED
}

type WorkflowStatus {
  status: ApprovalStatus!
  runId: String!
  currentStageIdx: Int!
  # Resolved workflow-definition stage names, in order. Lets approvers render
  # an accurate stepper without admin workflow-def access.
  stageNames: [String!]!
  # Current assignees per stage, index-aligned with stageNames: who must approve
  # and their decision state/comment/time. This is the stepper's roster source.
  stageAssignees: [[StageAssignee!]!]!
  # Per-stage approve-as-group unit progress, index-aligned with stageNames; an
  # empty inner list means the stage has no group units.
  stageUnitProgress: [[StageUnitProgress!]!]!
}

type PendingTask {
  taskId: ID!
  runId: String!
  policyVersionId: ID!
  policyTitle: String!
  stageIndex: Int!
  dueAt: String   # ISO-8601; null when the engine has not set a due time
}

type UpcomingApproval {
  policyVersionId: ID!
  policyTitle: String!
  stageIndex: Int!
  stageName: String!
}

type EffectiveWorkflow {
  # The resolved workflow-definition id, or null when none is attached/inherited.
  workflowDefId: ID
  # True when an approval workflow is attached to the policy's category or inherited
  # from an ancestor up to top level — i.e. the policy can be submitted.
  hasWorkflow: Boolean!
  # True when the resolved workflow is USABLE — every required stage has at least
  # one approver. False means it can't run yet (a stage is unstaffed). Lets the
  # submit UI disable proactively + explain, instead of failing on submit.
  # Defaults true when hasWorkflow is false (nothing to gate on).
  usable: Boolean!
  # When usable=false, the name of the first stage lacking an approver (for a
  # human-readable notice, e.g. "The 'Approval' stage has no approver"); null otherwise.
  firstUnstaffedStage: String
}

extend type Query {
  """
  Status of the approval saga for a policy version. Returns
  APPROVAL_STATUS_UNSPECIFIED when the workflow service has no record (the
  policy was published without going through an approval flow).
  """
  workflowStatus(policyVersionId: ID!): WorkflowStatus!

  """
  Pending approval tasks awaiting the authenticated user. The approver id is
  bound from the signed-in user and is never client-supplied.
  """
  pendingTasks: [PendingTask!]!

  """
  Approvals where the authenticated user is an approver on a future (not-yet-
  reached) stage — visibility/heads-up, not yet actionable. Approver id is bound
  from the signed-in user and is never client-supplied.
  """
  upcomingApprovals: [UpcomingApproval!]!

  """
  The approval workflow EFFECTIVE for a policy — attached to its category or
  inherited from an ancestor up to top level. hasWorkflow=false means the policy
  cannot be submitted for approval until an admin attaches one. The gateway
  resolves the category lineage and delegates to the workflow service so this is
  the same resolution Submit enforces.
  """
  effectiveWorkflow(policyId: ID!): EffectiveWorkflow!
}

extend type Mutation {
  """
  Start an approval saga for a policy version. The submittedBy field is bound
  from the signed-in user; ancestorCategoryIds is the policy's category lineage leaf→root
  so the workflow service can resolve the effective workflow without a
  cross-service call back into policy-core.
  """
  submitWorkflow(
    policyVersionId: ID!
    policyId: ID!
    categoryId: ID!
    ancestorCategoryIds: [ID!]!
  ): WorkflowSubmitResult!

  """
  Deliver an approver decision to an active run. The actor is bound from
  the signed-in user. The comment is required for APPROVE and REJECT signals
  (the workflow service rejects empty comments with InvalidArgument).

  policyVersionId is authoritative: the decision targets that version's CURRENT
  active approval. runId/taskId are advisory only (a cached inbox row may be
  stale); the server ignores them for resolution. A stale click on a no-longer-
  active approval returns FailedPrecondition ("refresh your inbox"), never a
  raw NotFound.
  """
  signalWorkflow(
    policyVersionId: ID!
    runId: ID!
    taskId: ID!
    signal: SignalType!
    comment: String!
  ): Boolean!

  """
  Swap the active approver on a stage. Audited swap; the
  initiator role is server-derived from the signed-in user (admin /
  self-delegate / workflow-author). outOfEligibilityAck must be true
  when an admin swaps in a user outside the seat's eligible pool. stageEligibleAssignees lists the users accepted without it.

  Workflow refusals relay as coded errors: extensions.code is the symbol,
  extensions.codeNum the number, extensions.domain "workflow", and each
  metadata key below is its own extension:
    SWAP_ASSIGNEE_FORBIDDEN (6002): role
    SWAP_REASON_REQUIRED (6004)
    SWAP_USERS_REQUIRED (6005)
    SWAP_SAME_USER (6006)
    SWAP_INITIATOR_ROLE_REQUIRED (6007)
    SWAP_ASSIGNMENT_NOT_FOUND (6008): stage, current_user_id
    SWAP_ASSIGNMENT_NOT_PENDING (6009): stage, current_user_id, state
    SWAP_ASSIGNEE_NOT_ELIGIBLE (6010): stage, stage_name, new_user_id (the
      refused candidate)
    STAGE_INDEX_OUT_OF_RANGE (6011): stage, stage_count
    APPROVAL_RUN_NOT_FOUND (6012): policy_version_id
  """
  swapAssignee(input: SwapAssigneeInput!): SwapAssigneeResult!

  """
  Approve or reject several pending assignments in one call. Every
  decision in the batch must include a non-empty comment (the server stores
  one comment per decision). Returns per-row results so a partially-
  failed batch can be surfaced to the operator.
  """
  bulkDecide(input: BulkDecideInput!): BulkDecideResult!
}

# --- Reassignment, bulk decisions and history ---

enum InitiatorRole {
  INITIATOR_ROLE_UNSPECIFIED
  INITIATOR_ROLE_ADMIN
  INITIATOR_ROLE_SELF_DELEGATE
  INITIATOR_ROLE_WORKFLOW_AUTHOR
}

input SwapAssigneeInput {
  policyVersionId: ID!
  stageIndex: Int!
  currentUserId: ID!
  newUserId: ID!
  reason: String!
  """
  Must be true when an admin is swapping in a user outside the seat's
  eligible pool; the swap is audited with out_of_eligibility=true.
  """
  outOfEligibilityAck: Boolean
}

type SwapAssigneeResult {
  newAssignmentId: ID!
  newSlaDeadlineAt: String!  # ISO-8601
}

enum DecisionType {
  DECISION_TYPE_UNSPECIFIED
  DECISION_TYPE_APPROVE
  DECISION_TYPE_REJECT
}

input DecisionInput {
  policyVersionId: ID!
  stageIndex: Int!
  decision: DecisionType!
  comment: String!
}

input BulkDecideInput {
  decisions: [DecisionInput!]!
}

type DecisionResult {
  policyVersionId: ID!
  stageIndex: Int!
  ok: Boolean!
  error: String
  assignmentId: ID
}

type BulkDecideResult {
  results: [DecisionResult!]!
  bulkBatchId: ID!
}

type AssignmentHistoryEntry {
  id: String!  # int64 surfaced as string for JS-safe integers
  assignmentId: ID!
  # One of created, swapped_in, swapped_out, approved, rejected, paused,
  # resumed, withdrawn, reassigned. Clients should render an unknown value
  # with a fallback, since workflow may add events.
  event: String!
  actorUserId: ID!
  actorRole: String
  previousUserId: ID
  newUserId: ID
  outOfEligibility: Boolean!
  reason: String
  createdAt: String!  # ISO-8601
  # Display names resolved server-side for the actor / swap participants, so a
  # non-admin caller (who cannot query the site-admin-only `users` directory)
  # still sees human names in the History timeline. Authz rationale: these only
  # name users already referenced by records the caller is authorized to read
  # (same authz as the entry itself); no broader directory is exposed. Null when
  # the id can't be resolved — the client then falls back to a short id.
  actorName: String
  previousUserName: String
  newUserName: String
}

extend type Query {
  """
  Append-only audit history for one stage of one policy version's approval
  run. Workflow authorizes it (admin, auditor, the policy's author, or a current
  or past assignee on the stage).
  """
  assignmentHistory(policyVersionId: ID!, stageIndex: Int!): [AssignmentHistoryEntry!]!

  """
  The eligible-assignee pool for one stage of a policy version's approval run:
  the users swapAssignee accepts as newUserId without outOfEligibilityAck, in
  workflow definition order. It comes from the same stage descriptor
  swapAssignee checks, so a picker built on it cannot drift from the rule. The
  pool can include users who already hold a seat on the stage
  (workflowStatus.stageAssignees says who does), and is empty when the stage
  names no individual approvers.

  Requires workflow.manage (template-admin, site-admin), the same gate as
  swapAssignee: workflow does no authz on this read. Anyone else gets
  PERMISSION_DENIED before workflow is called.

  Workflow refusals relay as coded errors (extensions.domain "workflow"):
    STAGE_INDEX_OUT_OF_RANGE (codeNum 6011): extensions.stage, stage_count
    APPROVAL_RUN_NOT_FOUND (codeNum 6012): extensions.policy_version_id
  """
  stageEligibleAssignees(policyVersionId: ID!, stageIndex: Int!): StageEligibleAssignees!
}

type StageEligibleAssignees {
  stageIndex: Int!
  stageName: String!
  # The pool resolved to labels, in definition order. A user identity cannot
  # resolve keeps its id as the name, as in resolveUserLabels.
  assignees: [UserLabel!]!
}


# --- Workflow definitions (admin management) ---
# The individual approvers a stage names for one category.
type CategoryApprovers {
  categoryId: ID!
  approverIds: [ID!]!
}
# A group that approves as a whole: its members hold group seats, the group is
# satisfied once internalQuorum of them approve, and it counts as one vote in
# the stage quorum.
type GroupUnit {
  groupId: ID!
  internalQuorum: String!  # one | majority | all
  memberUserIds: [ID!]!
}
type WorkflowStageDef {
  id: ID!
  name: String!
  approvers: [ID!]!
  approversByCategory: [CategoryApprovers!]!
  groupUnits: [GroupUnit!]!
  quorum: String!
  slaDays: Int
  rejectOnSlaBreach: Boolean
  pinnedLast: Boolean
}
type WorkflowDef {
  id: ID!
  name: String!
  description: String
  version: Int!
  stages: [WorkflowStageDef!]!
}
input CategoryApproversInput {
  categoryId: ID!
  approverIds: [ID!]!
}
input GroupUnitInput {
  groupId: ID!
  internalQuorum: String!  # one | majority | all
  memberUserIds: [ID!]!
}
input WorkflowStageInput {
  id: ID
  name: String!
  approvers: [ID!]!
  approversByCategory: [CategoryApproversInput!]
  groupUnits: [GroupUnitInput!]
  quorum: String!
  slaDays: Int
  rejectOnSlaBreach: Boolean
  pinnedLast: Boolean
}
extend type Query {
  workflowDefs: [WorkflowDef!]!
  workflowDef(id: ID!): WorkflowDef
}
extend type Mutation {
  createWorkflowDef(name: String!, description: String, stages: [WorkflowStageInput!]!): WorkflowDef!
  updateWorkflowDef(id: ID!, name: String!, description: String, stages: [WorkflowStageInput!]!): WorkflowDef!
  archiveWorkflowDef(id: ID!): Boolean!
}


