query WorkflowStatus($policyVersionId: ID!) {
  workflowStatus(policyVersionId: $policyVersionId) {
    status
    runId
    currentStageIdx
    stageNames
    stageAssignees {
      userId
      name
      state
      comment
      changesRequested
      changesRequestedAt
      decidedAt
      groupId
      roleLabel
    }
    stageUnitProgress {
      groupId
      groupName
      quorum
      required
      approvals
      pending
      roster
      status
    }
    targetChangeType
    targetSemanticVersion
    submittedBy
    submittedAt
    stageProgress {
      dueAt
      quorum
      quorumN
      approvals
      required
    }
  }
}
