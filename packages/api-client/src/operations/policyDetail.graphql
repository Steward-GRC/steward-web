query PolicyDetail($documentType: DocumentType!, $number: String!) {
  policyDetail(documentType: $documentType, number: $number) {
    id
    number
    title
    documentType
    category
    subcategory
    sensitivity
    status
    version
    ownerName
    published
    updated
    bodyText
    contentObfuscated
    canBreakGlass
    currentVersionId
    ack {
      acknowledged
      ackedAt
      required
    }
    appendices {
      id
      letter
      title
      text
    }
    definitions {
      id
      term
      definition
    }
    related {
      policyId
      number
      title
    }
    references {
      id
      label
      kind
      clause
      body
      url
    }
    contacts {
      id
      label
      name
      role
      department
      email
      phone
      hours
      notes
    }
    history {
      kind
      versionLabel
      stage
      actorName
      comment
      at
    }
    priorVersion {
      version
      diff {
        sectionKey
        sectionTitle
        changeType
        wordDiffHtml
      }
    }
  }
}
