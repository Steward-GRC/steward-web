query AckRoster($policyVersionId: ID!, $groupId: ID) {
  ackRoster(policyVersionId: $policyVersionId, groupId: $groupId) {
    acked {
      userId
      email
      userName
      ackedAt
      dueAt
      groups
    }
    pending {
      userId
      email
      userName
      ackedAt
      dueAt
      groups
    }
  }
}
