mutation SubmitWorkflow(
  $policyVersionId: ID!
  $policyId: ID!
  $categoryId: ID!
  $ancestorCategoryIds: [ID!]!
  $changeType: ChangeType
  $changeTypeReason: String
) {
  submitWorkflow(
    policyVersionId: $policyVersionId
    policyId: $policyId
    categoryId: $categoryId
    ancestorCategoryIds: $ancestorCategoryIds
    changeType: $changeType
    changeTypeReason: $changeTypeReason
  ) {
    runId
  }
}
