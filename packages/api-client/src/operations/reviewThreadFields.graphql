fragment ReviewThreadFields on ReviewThread {
  id
  policyVersionId
  quote
  occurrence
  resolved
  createdAt
  messages {
    id
    authorUserId
    authorName
    body
    createdAt
  }
  suggestion {
    text
    turn
    rounds {
      by
      text
      userId
      createdAt
    }
    outcome
    reason
    closedBy
    closedText
  }
}
