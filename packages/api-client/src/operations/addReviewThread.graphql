mutation AddReviewThread(
  $policyVersionId: ID!
  $quote: String!
  $occurrence: Int!
  $body: String!
  $suggestedText: String
) {
  addReviewThread(
    policyVersionId: $policyVersionId
    quote: $quote
    occurrence: $occurrence
    body: $body
    suggestedText: $suggestedText
  ) {
    ...ReviewThreadFields
  }
}
